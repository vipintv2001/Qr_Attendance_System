<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechE Attendance Portal</title>
    <style>
      :root {
        --primary-color: #4f46e5;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-sub: #64748b;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 85%;
        max-width: 380px;
        background: var(--card-bg);
        padding: 40px 30px;
        border-radius: 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
        text-align: center;
      }

      .logo-container { margin-bottom: 16px; display: flex; justify-content: center; align-items: center; }
      .logo-container img { max-width: 150px; height: auto; max-height: 60px; object-fit: contain; }
      h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px 0; }
      p { color: var(--text-sub); font-size: 14px; margin: 0 0 32px 0; }

      .welcome-badge {
        display: none;
        background-color: #eef2ff;
        color: var(--primary-color);
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 16px;
        border: 1px dashed #c7d2fe;
        line-height: 1.4;
      }

      .status-indicator {
        display: none;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 30px;
        margin-bottom: 24px;
        display: inline-block;
      }
      .status-in { background-color: #d1fae5; color: #065f46; }
      .status-out { background-color: #fef3c7; color: #92400e; }

      .input-group { text-align: left; margin-bottom: 20px; }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
      .prefix-input-wrapper { display: flex; align-items: center; border: 1.5px solid #e2e8f0; border-radius: 12px; background-color: #fcfcfd; overflow: hidden; }
      .prefix-text { padding: 16px 0 16px 16px; font-size: 16px; color: var(--text-sub); font-weight: 600; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 16px 16px 16px 4px; border: none; font-size: 16px; outline: none; background: transparent; }
      .prefix-input-wrapper:focus-within { border-color: var(--primary-color); }

      /* Professional Textarea Styles */
      textarea {
        width: 100%; 
        box-sizing: border-box; 
        padding: 14px; 
        border: 1.5px solid #e2e8f0; 
        border-radius: 12px; 
        font-size: 14px; 
        outline: none; 
        font-family: inherit; 
        resize: vertical; 
        min-height: 90px; 
        transition: all 0.2s;
        background-color: #fcfcfd;
      }
      textarea:focus {
        border-color: #ea580c;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.08);
      }

      button {
        width: 100%;
        padding: 16px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.1s;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img src="TechE_Logo_01.png" alt="TechE Education Logo" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';" />
        <div id="alt-logo" style="display: none; font-size: 26px; font-weight: 800; color: var(--primary-color);">TechE Education</div>
      </div>

      <h2>Employee Attendance Portal</h2>
      <p>Log your shift timings instantly</p>

      <div id="welcomeBadge" class="welcome-badge"></div>
      <div id="statusIndicator" class="status-indicator"></div>

      <form action="/api/attendance" method="POST" onsubmit="combinePrefix()">
        <input type="hidden" id="realEmployeeId" name="employeeId" />
        <input type="hidden" id="deviceToken" name="deviceToken" />
        <input type="hidden" id="attendanceAction" name="attendanceAction" />

        <div class="input-group" id="idInputGroup">
          <label for="empNumber">Employee ID</label>
          <div class="prefix-input-wrapper">
            <span class="prefix-text">TECHE</span>
            <input type="text" id="empNumber" placeholder="1001" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
          </div>
        </div>

        <!-- 🟢 Check-In Section -->
        <div id="checkin-section"></div>

        <!-- 🟠 Check-Out Section -->
        <div id="checkout-section" style="display: none;">
          <!-- 📝 Dynamic Work Summary Box for Check-Out -->
          <div class="input-group" id="workLogGroup">
            <label for="dailyWorkReport" style="color: #ea580c; font-weight: 700;">Daily Work Summary</label>
            <textarea 
              id="dailyWorkReport" 
              name="workSummary" 
              placeholder="What tasks or modules did you work on today?..."
              autocomplete="off"
            ></textarea>
          </div>
        </div>

        <button type="submit" id="submitBtn">Verify & Submit</button>
      </form>
    </div>

    <script>
      async function initializeAttendancePage() {
          let token = localStorage.getItem('teche_device_token');
          let savedId = localStorage.getItem('teche_saved_id');
          let savedName = localStorage.getItem('teche_saved_name');
          
          if (!token) {
              token = 'token_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
              localStorage.setItem('teche_device_token', token);
          }
          const deviceTokenInput = document.getElementById('deviceToken');
          if (deviceTokenInput) deviceTokenInput.value = token;

          const submitBtn = document.getElementById('submitBtn');
          const statusIndicator = document.getElementById('statusIndicator');
          const workLogGroup = document.getElementById('workLogGroup');
          const dailyWorkReport = document.getElementById('dailyWorkReport');
          const checkinSection = document.getElementById('checkin-section');
          const checkoutSection = document.getElementById('checkout-section');
          const attendanceActionInput = document.getElementById('attendanceAction');
          const idInputGroup = document.getElementById('idInputGroup');
          const empNumberInput = document.getElementById('empNumber');
          const welcomeBadge = document.getElementById('welcomeBadge');
          const realEmployeeIdInput = document.getElementById('realEmployeeId');

          let showScreen = 'checkin';

          if (savedId) {
              if (realEmployeeIdInput) realEmployeeIdInput.value = savedId;
              if (idInputGroup) idInputGroup.style.display = 'none';
              if (empNumberInput) empNumberInput.removeAttribute('required');
              
              const displayName = savedName ? savedName : savedId.toUpperCase();
              if (welcomeBadge) {
                  welcomeBadge.innerHTML = `👤 <b>${displayName}</b><br><small style="color:var(--text-sub); font-weight:500;">ID: ${savedId.toUpperCase()}</small>`;
                  welcomeBadge.style.display = 'block';
              }

              try {
                  const response = await fetch(`/api/attendance/status/${encodeURIComponent(savedId)}`);
                  if (response.ok) {
                      const data = await response.json();
                      if (data && data.showScreen) {
                          showScreen = data.showScreen;
                      }
                  }
              } catch (err) {
                  console.error("Error fetching status from server:", err);
              }
          } else {
              if (empNumberInput) empNumberInput.setAttribute('required', 'true');
              if (statusIndicator) statusIndicator.style.display = 'none';
              if (welcomeBadge) welcomeBadge.style.display = 'none';
          }

          if (showScreen === 'checkout') {
              if (attendanceActionInput) attendanceActionInput.value = 'Check-Out';
              if (checkinSection) checkinSection.style.display = 'none';
              if (checkoutSection) checkoutSection.style.display = 'block';
              if (workLogGroup) workLogGroup.style.display = 'block';
              if (dailyWorkReport) dailyWorkReport.setAttribute('required', 'true');
              
              if (statusIndicator) {
                  statusIndicator.innerText = "Status: Currently Working";
                  statusIndicator.className = "status-indicator status-in";
                  statusIndicator.style.display = 'inline-block';
              }
              if (submitBtn) {
                  submitBtn.innerText = "Check-Out";
                  submitBtn.style.backgroundColor = "#ea580c";
              }
          } else {
              // Default fallback: Check-In screen
              if (attendanceActionInput) attendanceActionInput.value = 'Check-In';
              if (checkinSection) checkinSection.style.display = 'block';
              if (checkoutSection) checkoutSection.style.display = 'none';
              if (workLogGroup) workLogGroup.style.display = 'none';
              if (dailyWorkReport) dailyWorkReport.removeAttribute('required');

              if (savedId && statusIndicator) {
                  statusIndicator.innerText = "Status: Currently Not Logged IN";
                  statusIndicator.className = "status-indicator status-out";
                  statusIndicator.style.display = 'inline-block';
              }
              if (submitBtn) {
                  submitBtn.innerText = "Check-In";
                  submitBtn.style.backgroundColor = "#10b981";
              }
          }
      }

      window.addEventListener('DOMContentLoaded', initializeAttendancePage);

      function combinePrefix() {
          let savedId = localStorage.getItem('teche_saved_id');
          
          if (!savedId) {
              const numInput = document.getElementById('empNumber').value.trim();
              savedId = 'teche' + numInput;
              document.getElementById('realEmployeeId').value = savedId;
              localStorage.setItem('teche_saved_id', savedId);
          }
      }
    </script>
  </body>
</html>
